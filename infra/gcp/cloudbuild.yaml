# Builds the checked-out monorepo; never extracts a historical source archive.
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, Dockerfile.api, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/concord-api:${_RELEASE}', '.']
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, Dockerfile.web, --build-arg, 'API_INTERNAL_BASE=http://localhost:4000', -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/concord-web:${_RELEASE}', '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/concord-api:${_RELEASE}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/concord-web:${_RELEASE}'
substitutions:
  _REGION: asia-south1
  _REPOSITORY: concord
  _RELEASE: candidate
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
