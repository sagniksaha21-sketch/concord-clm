name: Forge 14 Quality Gate
on:
  push:
    branches: [forge14-planning]
    paths:
      - 'forge13-native/**'
      - '.github/workflows/forge14-quality-gate.yml'
  pull_request:
    paths:
      - 'forge13-native/**'
      - '.github/workflows/forge14-quality-gate.yml'
concurrency:
  group: forge14-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge13-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit regression suite
        run: npm test
      - name: Product integrity gate
        run: node scripts/static-check.mjs
      - name: TypeScript gate
        run: npx tsc --noEmit
      - name: Expo configuration gate
        run: npx expo config --type public >/dev/null
      - name: Dependency health gate
        run: npx expo-doctor@latest
      - name: Reject vestigial Alpha artifacts
        run: |
          test ! -e FORGE-V13.0.0-ALPHA3-REBUILD-QA.md
          test ! -e FORGE-V13.0.0-ALPHA3-RECONCILIATION.md
      - name: Bundle production JavaScript
        run: npx expo export --platform android --output-dir dist-ci
      - name: Generate native Android release project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: forge13-native/android
      - name: Record RC evidence
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          sha256sum "$APK" | tee forge14-rc.sha256
          wc -c "$APK" | tee forge14-rc.size
          printf 'commit=%s\nversion=%s\nversionCode=%s\n' "$GITHUB_SHA" "$(node -p "require('./app.json').expo.version")" "$(node -p "require('./app.json').expo.android.versionCode")" | tee forge14-rc.txt
      - name: Upload RC APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-v14-rc-apk
          path: |
            forge13-native/android/app/build/outputs/apk/release/app-release.apk
            forge13-native/forge14-rc.sha256
            forge13-native/forge14-rc.size
            forge13-native/forge14-rc.txt
          if-no-files-found: error
          retention-days: 14
