name: Concord CI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'infra/**'
      - 'Dockerfile.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'infra/**'
      - 'Dockerfile.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: concord-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: concord_test
          POSTGRES_PASSWORD: concord_ci_disposable
          POSTGRES_DB: concord_requests_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U concord_test -d concord_requests_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@9.7.0 --activate
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @concord/shared build
      - run: pnpm --filter @concord/api db:generate
      - name: Migrate disposable PostgreSQL test database
        run: pnpm --filter @concord/api db:migrate
        env:
          DATABASE_URL: postgresql://concord_test:concord_ci_disposable@localhost:5432/concord_requests_test
      - run: pnpm typecheck
      - run: pnpm --filter @concord/api test
        env:
          REQUEST_TEST_DATABASE_URL: postgresql://concord_test:concord_ci_disposable@localhost:5432/concord_requests_test
      - run: pnpm build
      - run: node --test scripts/gcp/render-config.test.cjs
      - run: node scripts/check-ux.js
      - name: Build API image
        run: docker build --file Dockerfile.api --tag concord-api:ci .
      - name: Build web image
        run: docker build --file Dockerfile.web --build-arg NEXT_PUBLIC_API_BASE= --build-arg API_INTERNAL_BASE=http://localhost:4000 --tag concord-web:ci .
