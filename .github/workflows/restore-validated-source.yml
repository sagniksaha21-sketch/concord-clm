name: Restore validated Concord CLM source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-validated-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore validated source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_URL="https://raw.githubusercontent.com/sagniksaha21-sketch/concord-clm/62be50d0b26fbf9e6fc8f70386a26f9e8bdb019a/Concord-CLM-Premium-UX-2026-Mobile-Validated.zip"
          rm -rf /tmp/concord-restore /tmp/concord.zip
          mkdir -p /tmp/concord-restore
          curl -fsSL "$ARCHIVE_URL" -o /tmp/concord.zip
          unzip -q /tmp/concord.zip -d /tmp/concord-restore
          SRC="/tmp/concord-restore/concord_mobile_test"
          test -f "$SRC/package.json"
          test -f "$SRC/pnpm-lock.yaml"
          test -d "$SRC/apps"
          test -d "$SRC/packages"
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' "$SRC/" ./

      - name: Commit restored monorepo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Restore validated Concord CLM monorepo"
          git push origin HEAD:main
