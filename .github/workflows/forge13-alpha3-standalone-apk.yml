name: Forge 13 Alpha 3 Standalone APK

on:
  workflow_dispatch:
  push:
    branches:
      - forge13-alpha3-play
    paths:
      - ".github/workflows/forge13-alpha3-standalone-apk.yml"
      - "forge13-native/**"

permissions:
  contents: read

concurrency:
  group: forge13-alpha3-standalone-apk
  cancel-in-progress: true

jobs:
  build-standalone-apk:
    name: Build standalone Forge Alpha 3 APK
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"

    steps:
      - name: Checkout corrected Play-ready source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -perm -111 | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: forge13-native
        run: npm install --no-audit --no-fund

      - name: Run regression and integrity gates
        working-directory: forge13-native
        run: |
          node scripts/source-integrity.mjs
          npm test
          node scripts/static-check.mjs
          node scripts/check-body.mjs
          node scripts/parse-ts.mjs

      - name: Normalize Android 16 Expo config
        working-directory: forge13-native
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('app.json','utf8'));
          const walk=(v)=>{
            if(!v||typeof v!=='object') return;
            if(Object.prototype.hasOwnProperty.call(v,'edgeToEdgeEnabled')) delete v.edgeToEdgeEnabled;
            for(const x of Object.values(v)) walk(x);
          };
          walk(cfg);
          fs.writeFileSync('app.json',JSON.stringify(cfg,null,2));
          NODE

      - name: Generate Android project
        working-directory: forge13-native
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK with embedded JS bundle
        working-directory: forge13-native/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify standalone APK and JS bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="forge13-native/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'index.android.bundle|assets/.*bundle' >/dev/null
          mkdir -p dist-standalone
          OUT="dist-standalone/FORGE-V13.0.0-Alpha3-Standalone.apk"
          cp "$APK" "$OUT"
          SIZE="$(stat -c '%s' "$OUT")"
          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          printf 'version_name=13.0.0-alpha.3\nversion_code=130004\npackage=com.forge.training\nstandalone=true\nmetro_required=false\nfilename=%s\nsize_bytes=%s\nsha256=%s\ngit_sha=%s\n'             "$(basename "$OUT")" "$SIZE" "$SHA" "$GITHUB_SHA"             | tee dist-standalone/BUILD-METADATA.txt
          printf '%s  %s\n' "$SHA" "$(basename "$OUT")" > dist-standalone/SHA256.txt

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-V13.0.0-Alpha3-STANDALONE-APK
          path: |
            dist-standalone/FORGE-V13.0.0-Alpha3-Standalone.apk
            dist-standalone/BUILD-METADATA.txt
            dist-standalone/SHA256.txt
          if-no-files-found: error
          retention-days: 30
