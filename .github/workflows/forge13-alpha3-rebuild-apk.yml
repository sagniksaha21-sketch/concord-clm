name: Forge 13 Alpha 3 Rebuild APK

on:
  workflow_dispatch:
  push:
    branches:
      - forge13-alpha3-rebuild
    paths:
      - "forge13-native/**"
      - ".github/workflows/forge13-alpha3-rebuild-apk.yml"

permissions:
  contents: read

concurrency:
  group: forge13-alpha3-rebuild-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Forge 13 Alpha 3 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"

    steps:
      - name: Checkout clean reconstructed source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -perm -111 | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate direct Git source before dependency install
        working-directory: forge13-native
        shell: bash
        run: |
          set -euo pipefail
          node scripts/source-integrity.mjs
          (cd assets && sha256sum -c EXPECTED_SHA256.txt)
          test "$(node -p "require('./package.json').version")" = "13.0.0-alpha.3"
          ! find . -maxdepth 4 -type f \( -name '*.b64' -o -name '*.tar.gz' -o -name 'part-0*' \) | grep .

      - name: Install native dependencies
        working-directory: forge13-native
        run: npm install --no-audit --no-fund

      - name: Run staged regression and integrity gates
        working-directory: forge13-native
        run: |
          npm test
          node scripts/static-check.mjs
          node scripts/check-body.mjs
          node scripts/parse-ts.mjs

      - name: Normalize Android 16 Expo config
        working-directory: forge13-native
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          if(fs.existsSync('app.json')){
            const cfg=JSON.parse(fs.readFileSync('app.json','utf8'));
            let removed=0;
            const walk=(v)=>{
              if(!v||typeof v!=='object') return;
              if(Object.prototype.hasOwnProperty.call(v,'edgeToEdgeEnabled')){ delete v.edgeToEdgeEnabled; removed++; }
              for(const x of Object.values(v)) walk(x);
            };
            walk(cfg);
            fs.writeFileSync('app.json',JSON.stringify(cfg,null,2));
            console.log('[FORGE] edgeToEdgeEnabled entries removed:',removed);
          }
          NODE
          if [ -f app.config.js ]; then sed -i '/edgeToEdgeEnabled[[:space:]]*:/d' app.config.js; fi
          if [ -f app.config.ts ]; then sed -i '/edgeToEdgeEnabled[[:space:]]*:/d' app.config.ts; fi

      - name: Generate Android project
        working-directory: forge13-native
        run: npx expo prebuild --platform android --no-install

      - name: Build installable debug APK
        working-directory: forge13-native/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Verify, name and fingerprint APK
        shell: bash
        run: |
          set -euo pipefail
          APK="forge13-native/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          OUT="dist/FORGE-V13.0.0-Alpha3.apk"
          cp "$APK" "$OUT"
          SIZE="$(stat -c '%s' "$OUT")"
          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          printf 'version=13.0.0-alpha.3\nfilename=%s\nsize_bytes=%s\nsha256=%s\ngit_sha=%s\n' "$(basename "$OUT")" "$SIZE" "$SHA" "$GITHUB_SHA" | tee dist/BUILD-METADATA.txt
          printf '%s  %s\n' "$SHA" "$(basename "$OUT")" | tee dist/SHA256.txt
          ls -lh "$OUT"

      - name: Upload verified Forge Alpha 3 APK
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-V13.0.0-Alpha3-APK
          path: |
            dist/FORGE-V13.0.0-Alpha3.apk
            dist/SHA256.txt
            dist/BUILD-METADATA.txt
            forge13-native/FORGE-V13.0.0-ALPHA3-RECONCILIATION.md
            forge13-native/FORGE-V13.0.0-ALPHA3-REBUILD-QA.md
          if-no-files-found: error
          retention-days: 30
