name: Forge 13 Alpha 3 Play AAB

on:
  workflow_dispatch:
  push:
    branches:
      - forge13-alpha3-play
    paths:
      - "forge13-native/**"
      - ".github/workflows/forge13-alpha3-play-aab.yml"

permissions:
  contents: read

concurrency:
  group: forge13-alpha3-play-aab
  cancel-in-progress: true

jobs:
  build-play-aab:
    name: Build signed Forge Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 70

    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"

    steps:
      - name: Checkout Play-ready source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -perm -111 | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate direct source
        working-directory: forge13-native
        shell: bash
        run: |
          set -euo pipefail
          node scripts/source-integrity.mjs
          (cd assets && sha256sum -c EXPECTED_SHA256.txt)
          test "$(node -p "require('./package.json').version")" = "13.0.0-alpha.3"
          test "$(node -p "require('./app.json').expo.android.versionCode")" = "130003"
          ! find . -maxdepth 4 -type f \( -name '*.b64' -o -name '*.tar.gz' -o -name 'part-0*' \) | grep .

      - name: Install dependencies
        working-directory: forge13-native
        run: npm install --no-audit --no-fund

      - name: Run regression and integrity gates
        working-directory: forge13-native
        run: |
          npm test
          node scripts/static-check.mjs
          node scripts/check-body.mjs
          node scripts/parse-ts.mjs

      - name: Normalize Android 16 Expo config
        working-directory: forge13-native
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          if(fs.existsSync('app.json')){
            const cfg=JSON.parse(fs.readFileSync('app.json','utf8'));
            let removed=0;
            const walk=(v)=>{
              if(!v||typeof v!=='object') return;
              if(Object.prototype.hasOwnProperty.call(v,'edgeToEdgeEnabled')){ delete v.edgeToEdgeEnabled; removed++; }
              for(const x of Object.values(v)) walk(x);
            };
            walk(cfg);
            fs.writeFileSync('app.json',JSON.stringify(cfg,null,2));
            console.log('[FORGE] edgeToEdgeEnabled entries removed:',removed);
          }
          NODE

      - name: Generate Android project
        working-directory: forge13-native
        run: npx expo prebuild --platform android --no-install

      - name: Generate dedicated Google Play upload key
        working-directory: forge13-native
        shell: bash
        run: |
          set -euo pipefail
          STOREPASS="$(openssl rand -hex 24)"
          echo "::add-mask::$STOREPASS"
          echo "FORGE_UPLOAD_STOREPASS=$STOREPASS" >> "$GITHUB_ENV"
          echo "FORGE_UPLOAD_KEYPASS=$STOREPASS" >> "$GITHUB_ENV"
          echo "FORGE_UPLOAD_ALIAS=forge-upload" >> "$GITHUB_ENV"

          keytool -genkeypair             -keystore android/app/forge-upload.jks             -storepass "$STOREPASS"             -keypass "$STOREPASS"             -alias forge-upload             -keyalg RSA             -keysize 4096             -validity 10000             -dname "CN=FORGE Upload Key, O=FORGE, C=IN"

          mkdir -p ../dist-play
          printf '%s\n' "$STOREPASS" > ../dist-play/UPLOAD-KEY-PASSWORD.txt
          cp android/app/forge-upload.jks ../dist-play/FORGE-Alpha3-Play-Upload-Key.jks
          keytool -list -v             -keystore android/app/forge-upload.jks             -storepass "$STOREPASS"             -alias forge-upload             | sed -n '/Alias name:/p;/Creation date:/p;/Certificate fingerprints:/,/Signature algorithm name:/p'             > ../dist-play/UPLOAD-KEY-FINGERPRINT.txt

      - name: Configure release signing
        working-directory: forge13-native
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = 'android/app/build.gradle';
          let s = fs.readFileSync(p, 'utf8');

          const signingStart = s.indexOf('signingConfigs {');
          const buildTypesStart = s.indexOf('buildTypes {', signingStart);
          if (signingStart < 0 || buildTypesStart < 0) throw new Error('Expected signingConfigs/buildTypes not found');

          const beforeBuildTypes = s.slice(0, buildTypesStart);
          const lastClose = beforeBuildTypes.lastIndexOf('    }');
          if (lastClose < signingStart) throw new Error('Could not locate signingConfigs closing brace');

          const forgeConfig = [
            '        forgeUpload {',
            "            storeFile file('forge-upload.jks')",
            "            storePassword System.getenv('FORGE_UPLOAD_STOREPASS')",
            "            keyAlias System.getenv('FORGE_UPLOAD_ALIAS')",
            "            keyPassword System.getenv('FORGE_UPLOAD_KEYPASS')",
            '        }',
            ''
          ].join('\n');

          s = s.slice(0, lastClose) + forgeConfig + s.slice(lastClose);

          const releaseIndex = s.indexOf('release {', s.indexOf('buildTypes {'));
          if (releaseIndex < 0) throw new Error('Release build type not found');
          const releaseTail = s.slice(releaseIndex);
          const target = 'signingConfig signingConfigs.debug';
          const relPos = releaseTail.indexOf(target);
          if (relPos < 0) throw new Error('Expected debug signingConfig in release block not found');

          const absPos = releaseIndex + relPos;
          s = s.slice(0, absPos) + 'signingConfig signingConfigs.forgeUpload' + s.slice(absPos + target.length);
          fs.writeFileSync(p, s);
          console.log('[FORGE] release signing configured with dedicated upload key');
          NODE

      - name: Build signed Play AAB and standalone release APK
        working-directory: forge13-native/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify and package Play bundle
        shell: bash
        run: |
          set -euo pipefail
          AAB="forge13-native/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          OUT="dist-play/FORGE-V13.0.0-Alpha3-Play.aab"
          cp "$AAB" "$OUT"

          jarsigner -verify -verbose -certs "$OUT" >/dev/null

          SIZE="$(stat -c '%s' "$OUT")"
          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          printf 'version_name=13.0.0-alpha.3\nversion_code=130003\npackage=com.forge.training\nfilename=%s\nsize_bytes=%s\nsha256=%s\ngit_sha=%s\n'             "$(basename "$OUT")" "$SIZE" "$SHA" "$GITHUB_SHA"             | tee dist-play/PLAY-BUILD-METADATA.txt
          printf '%s  %s\n' "$SHA" "$(basename "$OUT")" | tee dist-play/SHA256.txt
          ls -lh "$OUT"

      - name: Upload Play distribution package
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-V13.0.0-Alpha3-PLAY
          path: |
            dist-play/FORGE-V13.0.0-Alpha3-Play.aab
            dist-play/FORGE-V13.0.0-Alpha3-Standalone.apk
            dist-play/FORGE-Alpha3-Play-Upload-Key.jks
            dist-play/UPLOAD-KEY-PASSWORD.txt
            dist-play/UPLOAD-KEY-FINGERPRINT.txt
            dist-play/PLAY-BUILD-METADATA.txt
            dist-play/SHA256.txt
          if-no-files-found: error
          retention-days: 30
